<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarnok</title>
  </head>
  <body>
    <div id="app" class="relative h-full w-full overflow-hidden">
      <div id="stage" class="absolute inset-0"></div>

      <div id="lobby" class="absolute inset-0 z-10 flex items-center justify-center bg-forge-900/95">
        <div class="flex w-[min(38rem,92vw)] flex-col items-center">
          <div class="ts-ribbon z-10 w-full -mb-6 text-2xl tracking-[0.4em]">TARNOK</div>

          <div class="ts-panel flex w-full flex-col items-stretch gap-5 pt-4">
            <p class="text-center text-sm leading-relaxed">
              Étape&nbsp;0 — deux onglets, un code de salon, et c'est le serveur qui décide des
              positions. Déplacement aux flèches ou&nbsp;WASD.
            </p>

            <button id="create" type="button" class="ts-button text-lg">Créer un salon</button>

            <div class="flex items-stretch gap-3">
              <input
                id="code"
                maxlength="4"
                placeholder="code"
                autocomplete="off"
                spellcheck="false"
                class="ts-input min-w-0 flex-1 text-lg"
              />
              <button id="join" type="button" class="ts-button ts-button--red shrink-0">
                Rejoindre
              </button>
            </div>

            <p id="error" class="min-h-5 text-center text-sm text-red-800"></p>
          </div>
        </div>
      </div>

      <div
        id="hud"
        class="pointer-events-none absolute left-4 top-4 z-10 hidden flex-col items-start gap-1"
      >
        <div class="ts-ribbon text-sm tracking-[0.25em]">
          SALON&nbsp;<b id="hud-code"></b>
        </div>
        <span id="hud-status" class="pl-2 text-xs text-forge-600"></span>

        <!--
          §4.6 : un HUD plutot que des logs — pv, niveau, chronometre.
          Pas de `.ts-panel` ici : ses bordures 9-slices font 32px, beaucoup
          trop lourdes pour un petit readout de coin d'ecran — meme raison
          que `.ts-input` (voir styles/main.css) n'emprunte rien au pack.
        -->
        <div
          class="mt-2 flex flex-col gap-1 rounded border border-forge-600 bg-forge-800/90 px-3 py-2 text-sm text-ember-400"
        >
          <span>PV&nbsp;<b id="hud-hp"></b></span>
          <span>Niveau&nbsp;<b id="hud-level"></b></span>
          <span id="hud-timer"></span>
        </div>

        <!--
          Tache 24 : indication minimale du gel de montee de niveau — l'etalage
          de cartes proprement dit arrive a l'etape 4, mais deux secondes ou
          plus rien ne bouge, sans un mot d'explication a l'ecran, se lisent
          comme un plantage. Meme registre visuel que le reste du petit
          readout ci-dessus (pas de `.ts-ribbon`/`.ts-panel` : leurs bordures
          9-slices sont bien trop lourdes pour ce coin d'ecran — voir le
          commentaire plus haut). Cache par defaut, `main.ts` ne l'affiche que
          pendant `GameClient.isFrozen`.
        -->
        <div
          id="hud-freeze"
          class="hidden rounded border border-ember-400 bg-forge-800/90 px-3 py-1 text-sm font-bold tracking-[0.1em] text-ember-400"
        >
          Niveau supérieur — pause…
        </div>

        <!-- Panneau de debogage : c'est ici, et seulement ici, qu'on apprend
             qu'une mort est arrivee trop tard pour etre rejouee (§4.6). -->
        <div class="pl-2 text-[10px] text-forge-600">
          morts tardives&nbsp;<span id="hud-late-deaths">0</span>
        </div>
      </div>

      <div
        id="summary"
        class="absolute inset-0 z-20 hidden items-center justify-center bg-forge-900/95"
      >
        <div class="flex w-[min(28rem,90vw)] flex-col items-center">
          <div class="ts-ribbon z-10 w-full -mb-6 text-xl tracking-[0.3em]">RUN TERMINEE</div>
          <div class="ts-panel flex w-full flex-col items-center gap-3 pt-6 text-center">
            <p>Temps survécu&nbsp;: <b id="summary-time"></b></p>
            <p>Niveau atteint&nbsp;: <b id="summary-level"></b></p>
            <p>Ennemis tués&nbsp;: <b id="summary-kills"></b></p>
            <button id="summary-restart" type="button" class="ts-button mt-2">
              Retour au lobby
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
