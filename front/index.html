<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarnok</title>
  </head>
  <body>
    <div id="app" class="relative h-full w-full overflow-hidden">
      <div id="stage" class="absolute inset-0"></div>

      <div id="lobby" class="absolute inset-0 z-10 flex items-center justify-center bg-forge-900/95">
        <div class="flex w-[min(38rem,92vw)] flex-col items-center">
          <div class="ts-ribbon z-10 w-full -mb-6 text-2xl tracking-[0.4em]">TARNOK</div>

          <div class="ts-panel flex w-full flex-col items-stretch gap-5 pt-4">
            <p class="text-center text-sm leading-relaxed">
              Étape&nbsp;0 — deux onglets, un code de salon, et c'est le serveur qui décide des
              positions. Déplacement aux flèches ou&nbsp;WASD.
            </p>

            <button id="create" type="button" class="ts-button text-lg">Créer un salon</button>

            <div class="flex items-stretch gap-3">
              <input
                id="code"
                maxlength="4"
                placeholder="code"
                autocomplete="off"
                spellcheck="false"
                class="ts-input min-w-0 flex-1 text-lg"
              />
              <button id="join" type="button" class="ts-button ts-button--red shrink-0">
                Rejoindre
              </button>
            </div>

            <p id="error" class="min-h-5 text-center text-sm text-red-800"></p>
          </div>
        </div>
      </div>

      <div
        id="hud"
        class="pointer-events-none absolute left-4 top-4 z-10 hidden flex-col items-start gap-1"
      >
        <div class="ts-ribbon text-sm tracking-[0.25em]">
          SALON&nbsp;<b id="hud-code"></b>
        </div>
        <span id="hud-status" class="pl-2 text-xs text-forge-600"></span>

        <!--
          §4.6 : un HUD plutot que des logs — pv, niveau, chronometre.
          Pas de `.ts-panel` ici : ses bordures 9-slices font 32px, beaucoup
          trop lourdes pour un petit readout de coin d'ecran — meme raison
          que `.ts-input` (voir styles/main.css) n'emprunte rien au pack.
        -->
        <div
          class="mt-2 flex flex-col gap-1 rounded border border-forge-600 bg-forge-800/90 px-3 py-2 text-sm text-ember-400"
        >
          <span>PV&nbsp;<b id="hud-hp"></b></span>
          <span>Niveau&nbsp;<b id="hud-level"></b></span>
          <span id="hud-timer"></span>

          <!--
            Étape 5a, §9 : la jauge de Synergie, « visible de tous ». C'est une
            ressource d'ÉQUIPE — le même nombre chez les quatre joueurs, porté
            par le snapshot à côté de l'expérience — et elle ne se remplit que
            lorsque deux joueurs différents déclenchent une réaction ensemble
            (§7). En solo elle ne bouge jamais, par construction.

            Le remplissage est un simple `div` dont `ui/hud.ts` règle la
            largeur : rien à charger, rien à dessiner par le moteur.
          -->
          <div class="mt-1 flex flex-col gap-0.5">
            <span class="text-[10px] tracking-[0.2em] text-forge-600">
              SYNERGIE&nbsp;<span id="hud-synergy-label">0 / 20</span>
            </span>
            <div class="h-1.5 w-32 overflow-hidden rounded-sm border border-forge-600 bg-forge-900">
              <div id="hud-synergy-fill" class="h-full w-0 bg-ember-400"></div>
            </div>
          </div>
        </div>

        <!--
          Tache 18 : la colonne des passifs, en haut a gauche.

          ⚠️ **Le NOMBRE D'EXEMPLAIRES, pas seulement le nom.** Un passif pris
          quatre fois n'est pas un passif pris une fois : tout s'empile et rien
          ne monte de niveau (modele Risk of Rain, §3.3 de la spec de l'etape
          4), donc c'est le compte qui dit ce qu'on a construit. Une liste de
          noms seuls decrirait quatre builds differents de la meme facon.

          Cachee tant que rien n'est drafte (`ui/hud.ts` bascule `hidden`) : un
          cadre vide au demarrage n'apprend rien et mange le coin de l'ecran.
          Meme registre visuel que le readout ci-dessus, et pour la meme raison
          — les bordures 9-slices de `.ts-panel` font 32 px.
        -->
        <div
          id="hud-passives"
          class="mt-2 hidden flex-col gap-0.5 rounded border border-forge-600 bg-forge-800/90 px-3 py-2 text-sm text-ember-400"
        >
          <span class="text-[10px] tracking-[0.2em] text-forge-600">PASSIFS</span>
          <div id="hud-passive-list" class="flex flex-col gap-0.5"></div>
        </div>

        <!--
          Tache 24 : indication minimale du gel de montee de niveau — l'etalage
          de cartes proprement dit arrive a l'etape 4, mais deux secondes ou
          plus rien ne bouge, sans un mot d'explication a l'ecran, se lisent
          comme un plantage. Meme registre visuel que le reste du petit
          readout ci-dessus (pas de `.ts-ribbon`/`.ts-panel` : leurs bordures
          9-slices sont bien trop lourdes pour ce coin d'ecran — voir le
          commentaire plus haut). Cache par defaut, `main.ts` ne l'affiche que
          pendant `GameClient.isFrozen`.
        -->
        <div
          id="hud-freeze"
          class="hidden rounded border border-ember-400 bg-forge-800/90 px-3 py-1 text-sm font-bold tracking-[0.1em] text-ember-400"
        >
          Niveau supérieur — pause…
        </div>

        <!-- Panneau de debogage : c'est ici, et seulement ici, qu'on apprend
             qu'une mort est arrivee trop tard pour etre rejouee (§4.6). -->
        <div class="pl-2 text-[10px] text-forge-600">
          morts tardives&nbsp;<span id="hud-late-deaths">0</span>
        </div>
      </div>

      <!--
        Tache 10 : l'etalage de cartes (§4.1, §4.2 et §7.2 de la spec de
        l'etape 4). Les cartes elles-memes sont creees par `ui/draft.ts` a
        chaque `DRAFT_OPEN` — leur nombre depend du nombre de joueurs
        (`joueurs + SPREAD_BONUS`), donc rien ici ne peut les prevoir.

        Pas de `.ts-panel` sur le conteneur exterieur : c'est `#draft-sheet`
        qui le porte, pour que le fond sombre puisse s'effacer a la revelation
        (voir `[data-settled='true']` dans styles/main.css) sans emporter le
        parchemin avec lui.
      -->
      <div
        id="draft"
        data-settled="false"
        class="absolute inset-0 z-20 hidden items-center justify-center"
      >
        <div class="flex w-[min(60rem,94vw)] flex-col items-center">
          <div class="ts-ribbon z-10 w-full -mb-6 text-xl tracking-[0.3em]">NIVEAU SUPÉRIEUR</div>
          <div id="draft-sheet" class="ts-panel flex w-full flex-col items-center gap-4 pt-4">
            <p id="draft-status" class="text-center text-sm font-bold tracking-[0.1em]"></p>
            <div id="draft-cards" class="flex flex-wrap justify-center gap-3"></div>
          </div>
        </div>
      </div>

      <div
        id="summary"
        class="absolute inset-0 z-20 hidden items-center justify-center bg-forge-900/95"
      >
        <div class="flex w-[min(28rem,90vw)] flex-col items-center">
          <div class="ts-ribbon z-10 w-full -mb-6 text-xl tracking-[0.3em]">RUN TERMINEE</div>
          <div class="ts-panel flex w-full flex-col items-center gap-3 pt-6 text-center">
            <p>Temps survécu&nbsp;: <b id="summary-time"></b></p>
            <p>Niveau atteint&nbsp;: <b id="summary-level"></b></p>
            <p>Ennemis tués&nbsp;: <b id="summary-kills"></b></p>
            <button id="summary-restart" type="button" class="ts-button mt-2">
              Retour au lobby
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
