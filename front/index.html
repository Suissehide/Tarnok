<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarnok</title>
  </head>
  <body>
    <div id="app" class="relative h-full w-full overflow-hidden">
      <div id="stage" class="absolute inset-0"></div>

      <div id="lobby" class="absolute inset-0 z-10 flex items-center justify-center bg-forge-900/95">
        <div class="flex w-[min(38rem,92vw)] flex-col items-center">
          <div class="ts-ribbon z-10 w-full -mb-6 text-2xl tracking-[0.4em]">TARNOK</div>

          <div class="ts-panel flex w-full flex-col items-stretch gap-5 pt-4">
            <p class="text-center text-sm leading-relaxed">
              Étape&nbsp;0 — deux onglets, un code de salon, et c'est le serveur qui décide des
              positions. Déplacement aux flèches ou&nbsp;WASD.
            </p>

            <button id="create" type="button" class="ts-button text-lg">Créer un salon</button>

            <div class="flex items-stretch gap-3">
              <input
                id="code"
                maxlength="4"
                placeholder="code"
                autocomplete="off"
                spellcheck="false"
                class="ts-input min-w-0 flex-1 text-lg"
              />
              <button id="join" type="button" class="ts-button ts-button--red shrink-0">
                Rejoindre
              </button>
            </div>

            <p id="error" class="min-h-5 text-center text-sm text-red-800"></p>
          </div>
        </div>
      </div>

      <div
        id="hud"
        class="pointer-events-none absolute left-4 top-4 z-10 hidden flex-col items-start gap-1"
      >
        <div class="ts-ribbon text-sm tracking-[0.25em]">
          SALON&nbsp;<b id="hud-code"></b>
        </div>
        <span id="hud-status" class="pl-2 text-xs text-forge-600"></span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
