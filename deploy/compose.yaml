name: tarnok

services:
  front:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.front
      args:
        # Inlinees dans le bundle au build (§5 du plan). `wss`, jamais `ws` :
        # une socket en clair depuis une page HTTPS est bloquee par le
        # navigateur, avec un message peu explicite.
        VITE_WS_URL: wss://${TRAEFIK_API_HOST}/ws
        VITE_API_URL: https://${TRAEFIK_API_HOST}
    image: '${CONTAINER_REGISTRY_PREFIX}${APP_IMAGE_NAME}-front:${VERSION:-latest}'
    container_name: '${APP_IMAGE_NAME}-front'
    environment:
      # Substituees dans nginx.conf.template au demarrage du conteneur.
      ASSETS_BASE_URL: ${ASSETS_BASE_URL}
      # DNS embarque de Docker sur un reseau defini par l'utilisateur. On le
      # passe explicitement : le `NGINX_LOCAL_RESOLVERS` de l'image nginx n'est
      # pas visible par envsubst, et un resolver non substitue empeche nginx de
      # demarrer.
      ASSETS_RESOLVER: ${ASSETS_RESOLVER:-127.0.0.11}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tarnok-front.rule=Host(`${TRAEFIK_FRONT_HOST}`)
      - traefik.http.routers.tarnok-front.entrypoints=https
      - traefik.http.routers.tarnok-front.tls=true
      - traefik.http.routers.tarnok-front.tls.certresolver=ovh
      - traefik.http.services.tarnok-front.loadbalancer.server.port=80
    depends_on: [back]
    restart: unless-stopped
    networks: [proxy]

  back:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.back
    image: '${CONTAINER_REGISTRY_PREFIX}${APP_IMAGE_NAME}-back:${VERSION:-latest}'
    container_name: '${APP_IMAGE_NAME}-back'
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: https://${TRAEFIK_FRONT_HOST}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tarnok-api.rule=Host(`${TRAEFIK_API_HOST}`)
      - traefik.http.routers.tarnok-api.entrypoints=https
      - traefik.http.routers.tarnok-api.tls=true
      - traefik.http.routers.tarnok-api.tls.certresolver=ovh
      - traefik.http.services.tarnok-api.loadbalancer.server.port=3000
    healthcheck:
      # 127.0.0.1 et pas `localhost` : dans l'image alpine, `localhost` resout
      # d'abord en ::1, or le serveur n'ecoute qu'en IPv4. Avec `localhost`, le
      # healthcheck echoue indefiniment sur un serveur parfaitement sain.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [proxy, internal]
    # ⚠️ Un salon vit dans la memoire d'un process : ne PAS monter de repliques
    # avant d'avoir choisi entre l'affinite de session Traefik et un routage par
    # code de salon (§5 du plan). Un round-robin enverrait les joueurs d'un meme
    # salon sur des process differents et plus rien ne fonctionnerait.
    deploy:
      replicas: 1

  db:
    image: postgres:16-alpine
    container_name: '${APP_IMAGE_NAME}-db'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    networks: [internal]

volumes:
  pgdata:

networks:
  proxy:
    name: proxy
    external: true
  internal:
    name: tarnok-internal
