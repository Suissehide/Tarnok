name: tarnok

# Variante Dokploy de `deploy/compose.yaml` : memes services, mais sans labels
# Traefik ni reseau `proxy`. Les domaines se declarent dans l'onglet Domains de
# Dokploy — `front` sur le port 80, `back` sur le port 3000 — et Dokploy branche
# lui-meme ses conteneurs a son Traefik. Les variables se saisissent dans
# l'onglet Environment ; le gabarit reste `deploy/.env.example`.

services:
  front:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.front
      args:
        # Inlinees dans le bundle au build (voir `deploy/Dockerfile.front`).
        # `wss`, jamais `ws` : une socket en clair depuis une page HTTPS est
        # bloquee par le navigateur.
        VITE_WS_URL: wss://${TRAEFIK_API_HOST}/ws
        VITE_API_URL: https://${TRAEFIK_API_HOST}
    image: ${APP_IMAGE_NAME}-front:${VERSION:-latest}
    environment:
      ASSETS_BASE_URL: ${ASSETS_BASE_URL}
      # DNS embarque de Docker, voir `deploy/compose.yaml`.
      ASSETS_RESOLVER: ${ASSETS_RESOLVER:-127.0.0.11}
    depends_on: [back]
    restart: unless-stopped

  back:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.back
    image: ${APP_IMAGE_NAME}-back:${VERSION:-latest}
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: https://${TRAEFIK_FRONT_HOST}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      # 127.0.0.1 et pas `localhost` : voir `deploy/compose.yaml`.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # ⚠️ Un salon vit dans la memoire d'un process : une seule replique, voir
    # `deploy/compose.yaml`.
    deploy:
      replicas: 1

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes: [tarnok-pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

volumes:
  tarnok-pgdata:
