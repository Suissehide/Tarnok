name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # La MEME image Postgres que deploy/compose.yaml : pas de derive entre ce
    # qui est teste et ce qui est deploye.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarnok
          POSTGRES_PASSWORD: tarnok
          POSTGRES_DB: tarnok
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tarnok -d tarnok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Installation a la racine : le lockfile des workspaces y vit, et c'est
      # `<racine>/node_modules` qui rend `shared/` resolvable depuis les deux
      # paquets.
      - run: npm ci

      # `biome check` verifie format ET lint en une passe, et echoue si un
      # fichier n'est pas formate : pas de debat de style en revue.
      - run: npm run lint
      # AVANT le typecheck : sans ca, `@prisma/client` n'a que les types de
      # secours de son `postinstall` (`PrismaClient` en `any`), et un nom de
      # champ faux passerait le typecheck.
      - run: npm run db:generate -w back
        env:
          DATABASE_URL: postgresql://tarnok:tarnok@127.0.0.1:5432/tarnok
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgresql://tarnok:tarnok@127.0.0.1:5432/tarnok
      - run: npm run build -w front

      # Les assets Tiny Swords ne doivent jamais entrer dans l'historique : la
      # licence Pixel Frog interdit la redistribution, meme apres modification,
      # et ce depot est public. Une fois committes, les retirer demande une
      # reecriture — donc on echoue ici plutot que la.
      - name: aucun asset sous licence dans le depot
        run: |
          if git ls-files | grep -E '^assets/tinyswords|^docs/maquettes/.*\.html$'; then
            echo "::error::Des fichiers derives de Tiny Swords sont versionnes (voir NOTICE-assets.md)."
            exit 1
          fi
          echo "OK : rien de derive du pack n'est versionne."
